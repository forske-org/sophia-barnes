version: 0.1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --legacy-peer-deps
    build:
      commands:
        - env | grep -e AUTH_ADMIN >> .env.production
        - env | grep -e AUTH_GOOGLE_ID >> .env.production
        - env | grep -e AUTH_GOOGLE_SECRET >> .env.production
        - env | grep -e AUTH_SECRET >> .env.production
        - env | grep -e AUTH_URL >> .env.production
        - env | grep -e EMAIL_RECIPIENT >> .env.production
        - env | grep -e EMAIL_SENDER >> .env.production
        - env | grep -e SNOWFLAKE_ACCOUNT >> .env.production
        - env | grep -e SNOWFLAKE_DATABASE >> .env.production
        - env | grep -e SNOWFLAKE_PASSWORD >> .env.production
        - env | grep -e SNOWFLAKE_PRIVATE_KEY >> .env.production
        - env | grep -e SNOWFLAKE_ROLE >> .env.production
        - env | grep -e SNOWFLAKE_USERNAME >> .env.production
        - env | grep -e SNOWFLAKE_WAREHOUSE >> .env.production
        - NODE_ENV=production npm run build
  artifacts:
    # IMPORTANT - Please verify your build output directory
    baseDirectory: /.next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
